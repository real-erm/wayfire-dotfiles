[core]
plugins = autostart command grid vswitch expo animate blur decoration fast-switcher switcher foreign-toplevel idle move resize place session alpha wm-actions wobbly
close_top_view = <super> KEY_Q | <super> KEY_C
focus_change_timeout = 0
vwidth = 3
vheight = 1

# Input Settings: Keyboard layout toggle & Flat mouse acceleration (Wayfire session only)
[input]
xkb_layout = us,ara
xkb_options = grp:win_space_toggle,grp:alt_shift_toggle
xkb_model = pc105
cursor_theme = Bibata-Modern-Classic
cursor_size = 24
accel_profile = flat
mouse_accel_profile = flat
pointer_accel = 0.0
touchpad_accel_profile = flat
tap_to_click = true

# Window Management Actions: Show Desktop / Minimize all windows
[wm-actions]
toggle_showdesktop = <super> KEY_D

[autostart]
# Disable wf-shell autostart to eliminate duplicate top bar (we use Waybar)
autostart_wf_shell = false

# Desktop surface, icons, and native right-click desktop menu
desktop = pcmanfm-qt --desktop

# Synchronize display environment with systemd & D-Bus to prevent portal crashes
env_sync = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
portal_restart = systemctl --user restart xdg-desktop-portal xdg-desktop-portal-gtk

# XSettings daemon for dynamic GTK/Xwayland theme synchronization
xsettingsd = xsettingsd

# Top Bar & Notifications
waybar = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
notifications = mako
polkit = /usr/lib/hyprpolkitagent
idle = swayidle -w timeout 600 'hyprlock' before-sleep 'hyprlock'
nm_applet = nm-applet --indicator
blueman = blueman-applet
kdeconnect = kdeconnect-indicator

# Persistent Clipboard Managers (GUI CopyQ + background cliphist daemon)
copyq = copyq --start-server
clipboard_store = wl-paste --watch cliphist store
clipboard_img = wl-paste --type image --watch cliphist store

kanshi = kanshi
wallpaper = hyprpaper

[command]
# Applications & Launchers (Ctrl + Space for fast primary app launcher)
binding_terminal = <super> KEY_ENTER
command_terminal = foot || alacritty
binding_launcher = <ctrl> KEY_SPACE | <super> KEY_D
command_launcher = rofi -show drun
binding_clipboard = <super> KEY_V
command_clipboard = copyq toggle || ~/.config/wayfire/scripts/clipboard.sh pick
binding_files = <super> KEY_E
command_files = nautilus --new-window
binding_browser = <super> KEY_W
command_browser = sh -c 'gtk-launch $(xdg-settings get default-web-browser 2>/dev/null) 2>/dev/null || librewolf || brave || chromium'
binding_editor = <super> KEY_G
command_editor = geany
binding_settings = <super> KEY_I
command_settings = wcm

# Audio & Volume Controls (Linked to pavucontrol & WirePlumber streams)
binding_mute = KEY_MUTE
command_mute = ~/.config/wayfire/scripts/volume.sh mute
binding_vol_up = KEY_VOLUMEUP
command_vol_up = ~/.config/wayfire/scripts/volume.sh up
binding_vol_down = KEY_VOLUMEDOWN
command_vol_down = ~/.config/wayfire/scripts/volume.sh down
binding_mixer = <super> KEY_M
command_mixer = pavucontrol || pulsemixer
binding_play = KEY_PLAYPAUSE
command_play = playerctl play-pause
binding_next = KEY_NEXTSONG
command_next = playerctl next
binding_prev = KEY_PREVIOUSSONG
command_prev = playerctl previous

# Brightness Controls
binding_bright_up = KEY_BRIGHTNESSUP
command_bright_up = ~/.config/wayfire/scripts/brightness.sh up
binding_bright_down = KEY_BRIGHTNESSDOWN
command_bright_down = ~/.config/wayfire/scripts/brightness.sh down

# Screen Capture (Grim + Slurp + Swappy annotation)
binding_screenshot = KEY_SYSRQ | KEY_PRINT
command_screenshot = ~/.config/wayfire/scripts/screenshot.sh full
binding_screenshot_region = <shift> KEY_SYSRQ | <shift> KEY_PRINT | <super> <shift> KEY_S
command_screenshot_region = ~/.config/wayfire/scripts/screenshot.sh area
binding_screenshot_edit = <super> <shift> KEY_A
command_screenshot_edit = ~/.config/wayfire/scripts/screenshot.sh edit

# Session Controls
binding_lock = <super> KEY_L
command_lock = hyprlock
binding_logout = <super> KEY_X
command_logout = ~/.config/wayfire/scripts/powermenu.sh

# Window Switcher (Alt + Tab and Shift + Alt + Tab)
[fast-switcher]
activate = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 180

# Window Movement Spring/Wobbly Physics
[wobbly]
friction = 3.5
spring_k = 9.0
grid_resolution = 6

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[grid]
type = grid
duration = 150
snap_threshold = 10
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2 | <super> KEY_DOWN
slot_br = <super> KEY_KP3
slot_l = <super> KEY_KP4 | <super> KEY_LEFT
slot_c = <super> KEY_KP5
slot_r = <super> KEY_KP6 | <super> KEY_RIGHT
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8 | <super> KEY_UP
slot_tr = <super> KEY_KP9

[expo]
toggle = <super> KEY_GRAVE
duration = 150
offset = 10

# Snappy, fluid window animations without stutter
[animate]
open_animation = zoom
close_animation = zoom
minimize_animation = zoom
duration = 180

# Lightweight box blur optimized for legacy Intel HD Graphics
[blur]
method = box
box_passes = 1
box_offset = 1.0

# Consistent Dark Window Decorations
[decoration]
font = JetBrainsMono Nerd Font
title_height = 24
border_size = 2
active_color = 0.24 0.27 0.38 1.0
inactive_color = 0.10 0.11 0.15 1.0
